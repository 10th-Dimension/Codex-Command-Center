name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f \( -name "*.test.js" -o -name "*.test.mjs" -o -name "*.test.cjs" -o -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.js" -o -name "*.spec.mjs" -o -name "*.spec.cjs" -o -name "*.spec.ts" -o -name "*.spec.tsx" \) -print -quit | grep -q .; then
            npm test
          else
            echo "No tests found; skipping test step."
          fi

      - name: Production build
        run: npm run build
